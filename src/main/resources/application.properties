spring.application.name=DecodeSpring
build.version=1.0.0

spring.profiles.active=default

app.name=DecodeSpringApplication
app.description=Spring Boot Application for Redis Integration
app.version=${build.version}
# Local Redis configuration
#spring.redis.host=localhost
#spring.redis.port=6379

#Cloud Redis configuration
spring.redis.host=redis-15991.c301.ap-south-1-1.ec2.cloud.redislabs.com
spring.redis.port=15991
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=true
spring.redis.timeout=60000
spring.redis.lettuce.pool.max-active=1
spring.redis.lettuce.pool.max-idle=1
spring.redis.lettuce.pool.min-idle=0

# Authentication lab defaults. Values are deliberately local/demo-only and may be
# overridden with environment variables. External providers have their own profiles.
auth-demo.jwt.secret=${AUTH_DEMO_JWT_SECRET:change-this-local-demo-secret-at-least-32-bytes}
auth-demo.jwt.ttl=PT15M
auth-demo.api-key=${AUTH_DEMO_API_KEY:demo-key}
auth-demo.remember-me-key=${AUTH_DEMO_REMEMBER_ME_KEY:local-remember-me-key-change-me}
external-api.key=${REQRES_API_KEY:}
external-api.endpoint=https://reqres.in/api/users/2
