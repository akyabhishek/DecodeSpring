spring.config.activate.on-profile=oidc
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${OIDC_CLIENT_ID:auth-demo-app}
spring.security.oauth2.client.registration.keycloak.client-secret=${OIDC_CLIENT_SECRET:local-demo-client-secret}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8180/realms/auth-demo}
