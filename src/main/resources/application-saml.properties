spring.config.activate.on-profile=saml
# Supply a real test IdP's metadata URI. See docs/testing.md; no assertion is ever accepted without validation.
spring.security.saml2.relyingparty.registration.test-idp.assertingparty.metadata-uri=${SAML_IDP_METADATA_URI:http://localhost:8088/realms/auth-demo/protocol/saml/descriptor}
spring.security.saml2.relyingparty.registration.test-idp.entity-id={baseUrl}/saml2/service-provider-metadata/test-idp
