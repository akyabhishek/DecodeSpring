services:
  service1:
    image: "image1:latest"
    container_name: image1_container
    ports:
        - "8080:80"

    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - network_name
  service2:
    image: "image2:latest"
    container_name: image2_container
    ports:
        - "9090:90"

    deploy:
      resources:
        limits:
          memory: 500m
    networks:
        - network_name
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    profiles: ["auth-demo"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./infrastructure/keycloak:/opt/keycloak/data/import:ro
    networks:
      - network_name

  openldap:
    image: bitnami/openldap:2.6
    profiles: ["auth-demo"]
    environment:
      LDAP_ROOT: dc=example,dc=org
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    ports:
      - "1389:1389"
    volumes:
      - ./infrastructure/ldap:/ldifs:ro
    networks:
      - network_name
# Define the custom network
networks:
    network_name:
        driver: "bridge"
